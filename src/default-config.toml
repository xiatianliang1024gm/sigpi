[models.local]
base_url = "http://localhost:8000/v1"
api_key = "your-api-key"
name = "your-model-name"
# Wire format used to talk to this provider. Choices:
#   "chat_completions" - the OpenAI chat completions API (works with OpenAI,
#                        DeepSeek, Ollama, LiteLLM, Anthropic-via-proxy, etc.)
#   "responses"        - the newer OpenAI Responses API
api_format = "chat_completions"
timeout_ms = 60000
max_retries = 2
retry_base_delay_ms = 250
# stream = true  # set false for providers that do not support streaming
# max_tokens = 8192  # model max output tokens; caps the /compact summary request
# hard_context_limit = 200000  # model's total token budget (physical ceiling)
# reserve_tokens = 16384  # headroom reserved for the model's response
# keep_recent_tokens = 20000  # recent tokens kept un-summarized

# [models.remote]
# base_url = "https://api.example.com/v1"
# api_key = "your-api-key"
# name = "remote-model"
# api_format = "responses"  # "chat_completions" or "responses" (see [models.local])
# hard_context_limit = 128000
# reserve_tokens = 16384
# keep_recent_tokens = 20000

[agent]
# Max steps in a turn; prevents infinite loops. A step is one model call plus
# the tool calls it makes. Raise for long multi-tool tasks, lower for tighter
# turn budgets.
max_steps = 300

[logging]
# Verbosity of ~/.sigpi/logs/agent.log. Choices:
#   "debug" - everything, including tool call details and the FULL
#             LLM request/response bodies (model_request_body /
#             model_response_body; noisiest, use for troubleshooting)
#   "info"  - normal operational events (default)
#   "warn"  - only warnings and errors
#   "error" - only errors
level = "info"
file = "~/.sigpi/logs/agent.log"
# Max chars of a model response body captured in logs.
# max_body_preview_chars = 16000

[storage]
sessions_root = "~/.sigpi/projects"

[shell]
# Shell used for the bash tool. Choices:
#   "zsh"        - Z shell (macOS default)
#   "bash"       - Bourne Again shell (Linux default)
#   "sh"         - POSIX shell
#   "pwsh"       - PowerShell 7+ (cross-platform)
#   "powershell" - Windows PowerShell (5.x)
#   "cmd"        - Windows Command Prompt
# kind = "zsh"
# path = "/bin/zsh"

[tools.bash]
# Command timeout bounds (milliseconds). default_timeout_ms must be <= max_timeout_ms.
# default_timeout_ms = 120000
# max_timeout_ms = 600000
# Inline output length (chars) before overflow is written to a session file.
# max_output_length = 30000
# Optional shell script sourced before each command so env vars persist.
# env_file = "~/.sigpi/bash-env.sh"
